# Declarative source registry. Add a source = add a YAML block, no code change.
#
# NOTE: entries marked `status: PROPOSED` are sensible defaults picked during
# scaffolding and still need a human yes/no (some sites' ToS or anti-bot posture
# may rule them out). `status: ACTIVE` means wired and confirmed.

# --------------------------------------------------------------------------- #
# Phase I — bulk directories
# --------------------------------------------------------------------------- #
research_papers:
  - name: "arXiv"
    status: ACTIVE
    kind: api
    # arXiv Atom API — no key required
    base_url: "http://export.arxiv.org/api/query"
    categories: ["cs.AI", "cs.LG", "cs.CL", "cs.CV", "cs.NE", "stat.ML"]
    page_size: 200

  - name: "Papers with Code"
    status: PROPOSED
    kind: api
    base_url: "https://paperswithcode.com/api/v1"
    # correlates papers -> official GitHub repo for star counts

startups:
  - name: "Y Combinator Companies"
    status: PROPOSED
    kind: html
    base_url: "https://www.ycombinator.com/companies"
    note: "Algolia-backed listing; industry filter = 'Artificial Intelligence'"

products:
  - name: "There's An AI For That"
    status: ACTIVE
    kind: html
    base_url: "https://theresanaiforthat.com"
    # Every page is Cloudflare-gated (direct fetch => 403). Listing pages need a
    # JS render to populate the tool cards; detail pages do not. Both go through
    # the ScraperAPI escalation ladder. This is the Phase V demonstration: a
    # site that hard-blocks automated requests, scraped successfully.
    render: true            # listing pages: ScraperAPI render=true
    detail_render: false    # /ai/<slug>/ pages: ScraperAPI render=false (cheaper)
    list_urls:
      - "newest/"
      - "period/2026/08/28/"
      - "period/2026/08/21/"
      - "period/2026/08/14/"
    selectors:
      item: "a.ai_link"
      link: "self"          # the matched <a> is itself the tool link
    note: "Phase V demonstration: aggressive anti-bot, bypassed via ScraperAPI residential + render"

# --------------------------------------------------------------------------- #
# Phase II — 5 news sources + 5 job boards (24h freshness)
# --------------------------------------------------------------------------- #
news:
